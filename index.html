<!DOCTYPE html>
<html>
<head>
  <base href="/physiotherapy/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your App Name</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    let _char     = null;
    let _device   = null;
    let _bleCallback = null;

    window.setBleCallback = function(cb) {
      _bleCallback = cb;
    };

    window.bleConnect = async function() {
      try {
        // Step 1: Device picker
        _device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
        });
        console.log('Device selected:', _device.name);

        // Step 2: Small delay before GATT — helps on Windows
        await new Promise(r => setTimeout(r, 500));

        // Step 3: GATT connect with retry
        let server = null;
        for (let i = 1; i <= 5; i++) {
          try {
            console.log('GATT attempt', i);
            server = await _device.gatt.connect();
            console.log('GATT connected');
            break;
          } catch(e) {
            console.warn('GATT attempt', i, 'failed:', e.message);
            await new Promise(r => setTimeout(r, 1000));
          }
        }
        if (!server) throw new Error('GATT failed after 5 attempts');

        // Step 4: Get service
        console.log('Getting service...');
        const service = await server.getPrimaryService(
          '6e400001-b5a3-f393-e0a9-e50e24dcca9e'
        );
        console.log('Service OK');

        // Step 5: Get characteristics
        // TX = 6e400003 (ESP32 → browser, NOTIFY)
        // RX = 6e400002 (browser → ESP32, WRITE)
        const txChar = await service.getCharacteristic(
          '6e400003-b5a3-f393-e0a9-e50e24dcca9e'
        );
        const rxChar = await service.getCharacteristic(
          '6e400002-b5a3-f393-e0a9-e50e24dcca9e'
        );
        console.log('Characteristics OK');

        // Step 6: Store write char and enable notifications
        _char = rxChar;
        await txChar.startNotifications();
        console.log('Notifications enabled');

        // Step 7: Listen for incoming data
        txChar.addEventListener('characteristicvaluechanged', (event) => {
          const decoded = new TextDecoder().decode(event.target.value);
          console.log('RX:', decoded);
          if (_bleCallback) _bleCallback(decoded);
        });

        // Step 8: Handle disconnect
        _device.addEventListener('gattserverdisconnected', () => {
          console.log('Disconnected');
          _char   = null;
          _device = null;
        });

        console.log('BLE ready');
        return true;
      } catch(e) {
        console.error('BLE error:', e);
        return false;
      }
    };

    window.bleSend = async function(cmd) {
      if (!_char) { console.warn('Not connected'); return false; }
      try {
        const bytes = new TextEncoder().encode(cmd);
        await _char.writeValueWithoutResponse(bytes);
        console.log('TX:', cmd);
        return true;
      } catch(e) {
        console.error('Send error:', e);
        return false;
      }
    };

    window.bleDisconnect = function() {
      try {
        if (_device && _device.gatt.connected) {
          _device.gatt.disconnect();
        }
      } catch(_) {}
      _char   = null;
      _device = null;
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
